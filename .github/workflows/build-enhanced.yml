name: 🍿 Build Universal Enhanced

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Enhanced
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source and public submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build JavaScript bundles
        run: npm run build

      - name: Generate client modules
        run: npm run build:args

      - name: Verify Shadowrocket module
        run: |
          test -f dist/DualSubs.Universal.srmodule
          grep -q '(cbcs|ctr|unenc|una-cbcs)-all-' \
            dist/DualSubs.Universal.srmodule
          echo "Enhanced Disney+ rule found."
          ls -lah dist

      - name: Upload Universal Enhanced
        uses: actions/upload-artifact@v4
        with:
          name: DualSubs-Universal-Enhanced
          path: dist/
          if-no-files-found: error
          retention-days: 14
